<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>База знаний агента по недвижимости</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>🏠 База знаний агента</h1>
        <p class="subtitle">Интерактивные скрипты и аргументы для звонков</p>
    </header>

    <main>
        <!-- Блок 1: Контекст рынка -->
        <section class="card">
            <h2>📊 Контекст рынка 2026</h2>
            <div class="select-group">
                <label for="contextSelect">Выберите тему:</label>
                <select id="contextSelect">
                    <option value="">-- Выберите --</option>
                </select>
            </div>
            <div id="contextResult" class="result-box hidden"></div>
        </section>

        <!-- Блок 2: Аргументы за работу с риелтором -->
        <section class="card">
            <h2>💼 Аргументы за работу с риелтором</h2>
            <div class="select-group">
                <label for="argsCategory">Категория:</label>
                <select id="argsCategory">
                    <option value="">-- Выберите категорию --</option>
                </select>
            </div>
            <div class="select-group">
                <label for="argsItem">Аргумент:</label>
                <select id="argsItem" disabled>
                    <option value="">-- Сначала выберите категорию --</option>
                </select>
            </div>
            <div id="argsResult" class="result-box hidden"></div>
        </section>

        <!-- Блок 3: Аргументация по ситуациям -->
        <section class="card">
            <h2>🗣️ Аргументация по ситуациям</h2>
            <div class="select-group">
                <label for="situationSelect">Ситуация клиента:</label>
                <select id="situationSelect">
                    <option value="">-- Выберите ситуацию --</option>
                </select>
            </div>
            <div class="select-group">
                <label for="argumentSelect">Аргумент:</label>
                <select id="argumentSelect" disabled>
                    <option value="">-- Сначала выберите ситуацию --</option>
                </select>
            </div>
            <div id="argumentResult" class="result-box hidden"></div>
        </section>

        <!-- Блок 4: Техники продаж -->
        <section class="card">
            <h2>🎯 Техники продаж</h2>
            <div class="select-group">
                <label for="techniqueSelect">Техника:</label>
                <select id="techniqueSelect">
                    <option value="">-- Выберите технику --</option>
                </select>
            </div>
            <div id="techniqueResult" class="result-box hidden"></div>
        </section>

        <!-- Блок 5: Быстрый поиск по типу клиента -->
        <section class="card highlight">
            <h2>⚡ Быстрый подбор по типу клиента</h2>
            <div class="select-group">
                <label for="clientType">Тип клиента:</label>
                <select id="clientType">
                    <option value="">-- Кто ваш клиент? --</option>
                </select>
            </div>
            <div id="clientResult" class="result-box hidden"></div>
        </section>
    </main>

    <footer>
        <p>© 2026 · База знаний для агентов по недвижимости</p>
    </footer>

    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
