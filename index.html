    const blockSelect = document.getElementById('blockSelect');
    const templateSelect = document.getElementById('templateSelect');
    const templateCard = document.getElementById('templateCard');
    const templateTitle = document.getElementById('templateTitle');
    const templateContent = document.getElementById('templateContent');
    const variablesSection = document.getElementById('variablesSection');
    const variablesContainer = document.getElementById('variablesContainer');
    const notification = document.getElementById('notification');

    blockSelect.addEventListener('change', function() {
        const selectedBlock = this.value;
        templateSelect.innerHTML = '<option value="">-- Выберите шаблон --</option>';
        
        if (selectedBlock && templates[selectedBlock]) {
            templateSelect.disabled = false;
            templates[selectedBlock].forEach((template, index) => {
                const option = document.createElement('option');
                option.value = index;
                option.textContent = template.title;
                templateSelect.appendChild(option);
            });
        } else {
            templateSelect.disabled = true;
        }
        
        templateCard.classList.remove('active');
        variablesSection.classList.remove('active');
    });

    templateSelect.addEventListener('change', function() {
        const selectedBlock = blockSelect.value;
        const selectedIndex = this.value;
        
        if (selectedBlock && selectedIndex !== '') {
            const template = templates[selectedBlock][selectedIndex];
            templateTitle.textContent = template.title;
            
            let content = template.content;
            
            // Проверяем наличие переменных в тексте
            const variableMatches = content.match(/\{([^}]+)\}/g);
            
            if (variableMatches) {
                variablesContainer.innerHTML = '';
                variablesSection.classList.add('active');
                
                variableMatches.forEach(match => {
                    const varName = match.replace(/[{}]/g, '');
                    const varDiv = document.createElement('div');
                    varDiv.className = 'variable-input';
                    varDiv.innerHTML = `
                        <label>${varName}:</label>
                        <input type="text" class="var-field" data-var="${match}" placeholder="Введите ${varName}">
                    `;
                    variablesContainer.appendChild(varDiv);
                });
                
                // Добавляем слушатели для обновления контента
                document.querySelectorAll('.var-field').forEach(field => {
                    field.addEventListener('input', updateTemplateContent);
                });
            } else {
                variablesSection.classList.remove('active');
            }
            
            templateContent.textContent = content;
            templateCard.classList.add('active');
        } else {
            templateCard.classList.remove('active');
            variablesSection.classList.remove('active');
        }
    });

    function updateTemplateContent() {
        const selectedBlock = blockSelect.value;
        const selectedIndex = templateSelect.value;
        
        if (selectedBlock && selectedIndex !== '') {
            const template = templates[selectedBlock][selectedIndex];
            let content = template.content;
            
            document.querySelectorAll('.var-field').forEach(field => {
                const varPlaceholder = field.dataset.var;
                const varValue = field.value || varPlaceholder;
                content = content.replace(varPlaceholder, varValue);
            });
            
            templateContent.textContent = content;
        }
    }

    function copyToClipboard() {
        const text = templateContent.textContent;
        
        navigator.clipboard.writeText(text).then(() => {
            const btn = document.getElementById('copyBtn');
            btn.classList.add('copied');
            btn.innerHTML = '<span>✅</span><span>Скопировано!</span>';
            
            notification.classList.add('show');
            
            setTimeout(() => {
                btn.classList.remove('copied');
                btn.innerHTML = '<span>📋</span><span>Копировать</span>';
                notification.classList.remove('show');
            }, 2000);
        }).catch(err => {
            alert('Ошибка копирования: ', err);
        });
    }
